# The local PostgreSQL 17 for development and the database tests (packages/db/CLAUDE.md), and a
# local email catcher for the worker: disposable containers, reachable from this machine only. The
# admin password is a fake shared with .env.example; `pnpm db:setup-local` then creates the roles
# and the development database.
# Start: docker compose up -d · stop: docker compose stop · dispose of it: docker compose down -v
name: vertex-mizan

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: local-only-admin-password
    ports:
      - 127.0.0.1:55417:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 2s
      retries: 30

  # Catches the worker's emails locally (invitations, password resets): SMTP on 1025, the inbox
  # at http://127.0.0.1:8025. Nothing leaves this machine.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

volumes:
  postgres-data:
