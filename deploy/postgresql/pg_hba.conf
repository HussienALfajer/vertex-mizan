# Client authentication of Mizan's PostgreSQL 17 cluster `mizan` (ADR 0020), installed by
# deploy/provision.sh as /etc/postgresql/17/mizan/pg_hba.conf. First match wins.
#
# TYPE  DATABASE      USER                                              ADDRESS        METHOD

# The superuser through the local socket only: provisioning, pgBackRest's backups and checks,
# pg_dump, and the backup monitor, all as the system user postgres.
local   all           postgres                                                         peer

# The four roles of packages/db (ADR 0003, ADR 0008), to Mizan's database only, over loopback
# with SCRAM: the API and worker (mizan_app, mizan_jobs, mizan_queue), the migrations (mizan_owner).
host    vertex_mizan  mizan_owner,mizan_app,mizan_jobs,mizan_queue      127.0.0.1/32   scram-sha-256

# Everything else is refused: no other role, database, socket user or address.
local   all           all                                                              reject
host    all           all                                                0.0.0.0/0      reject
host    all           all                                                ::/0           reject
