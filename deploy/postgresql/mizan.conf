# Settings of Mizan's PostgreSQL 17 cluster `mizan` (ADR 0020), installed by deploy/provision.sh as
# /etc/postgresql/17/mizan/conf.d/mizan.conf, which Debian's postgresql.conf includes last. A change
# here restarts the cluster on the next provisioning. Hub's cluster (17/main, 5432) is untouched.

# --- Connections: loopback only; nginx and the API are the only ways in.
listen_addresses = '127.0.0.1'
port = 5433
# The API and the worker's pools (app, jobs, queue roles) with room for migrations and psql.
max_connections = 60
password_encryption = scram-sha-256

# --- Memory, sized for the shared server (11 GiB, Hub's cluster beside it); reviewed after the
# first real month (ADR 0020).
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
huge_pages = try

# --- Write-ahead log and archiving: pgBackRest pushes every segment to both repositories (local
# and B2), and a segment is closed at least every minute, so a total loss of the server loses at
# most about one minute of committed entries (the recovery point).
wal_level = replica
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
archive_mode = on
archive_command = 'pgbackrest --stanza=mizan archive-push %p'
archive_timeout = 60
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Logging: to the cluster's log (/var/log/postgresql/postgresql-17-mizan.log).
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2000
log_lock_waits = on
log_temp_files = 10MB
log_checkpoints = on
log_autovacuum_min_duration = 10s

# --- Time: stored as timestamptz; the apps compute Damascus dates themselves.
timezone = 'UTC'
log_timezone = 'UTC'
