# Proxy settings for the Vertex Mizan API, installed as /etc/nginx/snippets/mizan-proxy.conf
# (copied from Vertex Hub's). X-Forwarded-For is overwritten, not appended: the API trusts it from
# loopback for its rate limits and the audit log (apps/api `trust proxy`), and only nginx can reach
# the API (it listens on 127.0.0.1).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_read_timeout 60s;
proxy_hide_header X-Powered-By;
