# Rate-limit zones for mizan.vertexmedia.pro, installed as /etc/nginx/conf.d/mizan-limits.conf.
# Defence in depth under the API's own limits (apps/api src/core/limits/, Better Auth's). Hits are
# logged to the site's error log, which the server's nginx-limit-req fail2ban jail watches.

# The site-wide request limit: 20 a second, burst 50, without the hashed build files, which are
# static, cached for a year and come by the dozen on a first page load (Vertex Hub's lesson:
# counting them got first-time visitors banned). A request with an empty key is not counted.
map $uri $mizan_general_key {
    ~^/assets/ "";
    default $binary_remote_addr;
}
limit_req_zone $mizan_general_key zone=mizangeneral:10m rate=20r/s;

# Anonymous or password-checking routes: sign-in, its second factor, the password reset, the
# re-authentication before a sensitive change, and invitations. 30 a minute per address: an office
# shares one public IP, and the API limits failures per account too.
limit_req_zone $binary_remote_addr zone=mizansignin:10m rate=30r/m;

# Hashed build files get their own per-IP connection cap instead of the server's `perip` (100):
# over HTTP/2 every stream counts as a connection, and a first load asks for many files at once.
limit_conn_zone $binary_remote_addr zone=mizanassets:10m;
