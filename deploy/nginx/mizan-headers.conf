# Response headers for mizan.vertexmedia.pro, installed as /etc/nginx/snippets/mizan-headers.conf.
# Included in the server block and again in every location that sets its own add_header, because
# add_header in a location drops everything inherited from the server block (SERVER.md rule 12).

# The server's standard set, copied rather than included so the site's policy is read here.
# Mizan needs no camera, microphone, location or payment, and is never framed.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content Security Policy: everything from the site itself. apps/web/index.html has no inline
# script; inline style attributes are allowed because Base UI positions popups with them; fonts
# and images may be data: URIs, which Vite inlines for small files.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# An internal system: keep it out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
