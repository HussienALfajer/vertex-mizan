name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Copied from Vertex Food's CI and adapted. Third-party actions are pinned to full commit SHAs (the
# tag in the comment); Dependabot proposes updates (.github/dependabot.yml). The gate job names are
# the checks main requires: renaming one means updating the ruleset too. Steps arrive with their
# first subject (.github/CLAUDE.md).
# Turborepo's remote cache (docs/testing.md, "CI") is on once the repository has the TURBO_TOKEN and
# TURBO_REMOTE_CACHE_SIGNATURE_KEY secrets and the TURBO_TEAM variable (TURBO_API for a cache other
# than Vercel's). Only the jobs that run turbo get them. Until then, and for pull requests without
# secrets, each job keeps its own cache (actions/cache).
jobs:
  # Pull requests that change only Markdown skip the checks; the gate job below still reports, so
  # the ruleset and auto-merge work. The scenario book (docs/scenarios/) is executed as tests
  # (ADR 0005), so its Markdown counts as code; so does brand/, whose identity tables and logo files
  # the token tests read (ADR 0009).
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '\.md$' && ! echo "$changed" | grep -qE '^(docs/scenarios|brand)/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Checks needed: $code"

  static:
    name: Lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      # The full history, so the error-code guard can read the registry at the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs: tasks whose inputs did not change are replayed, not rerun. A
      # pull request reads its own runs' cache and main's; main cannot read a pull request's (GitHub
      # keeps caches per branch), so after a merge main runs what the pull request changed once more.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - name: No known high-severity advisory in production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Migrations are generated from the Drizzle schema and never edited (/db-migration):
      # generating again must change nothing. Generating reads only the schema and needs no database.
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      # No migration may weaken a ledger or isolation guard (ADR 0008).
      - name: Migrations keep every guard
        run: pnpm check:migrations
      # Error codes are never renamed, removed or reused (ADR 0006): only appended.
      - name: Error codes stay stable
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:error-codes --base "$BASE"
      # The published OpenAPI document changes additively only (ADR 0006); apps/api/test/openapi.test.ts
      # checks that the committed document is the API's own.
      - name: Install oasdiff
        run: node scripts/tools.mjs install oasdiff
      - name: The OpenAPI document has no breaking change
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:openapi --base "$BASE"
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway PostgreSQL 17, the servers' version (ADR 0008), for the database tests; the
    # passwords are fake and exist only for this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://postgres:ci-only-admin-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://mizan_owner:ci-only-owner-password@localhost:5432/vertex_mizan
      DATABASE_APP_URL: postgres://mizan_app:ci-only-app-password@localhost:5432/vertex_mizan
      DATABASE_JOBS_URL: postgres://mizan_jobs:ci-only-jobs-password@localhost:5432/vertex_mizan
      DATABASE_QUEUE_URL: postgres://mizan_queue:ci-only-queue-password@localhost:5432/vertex_mizan
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs: tasks whose inputs did not change are replayed, not rerun. A
      # pull request reads its own runs' cache and main's; main cannot read a pull request's (GitHub
      # keeps caches per branch), so after a merge main runs what the pull request changed once more.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # The OpenAPI guard's tests (packages/config) run only where oasdiff is, and must run here.
      - name: Install oasdiff
        run: node scripts/tools.mjs install oasdiff
      - name: Database roles and development database
        run: pnpm db:setup-local
      # The development database migrated as a server is; the tests then migrate a fresh database
      # of their own per run.
      - name: Migrations apply to the development database
        run: pnpm db:migrate
      - run: pnpm test
      # The scenario book (ADR 0005, ADR 0008): every Approved case on a fresh database of its own;
      # Proposed cases are skipped and listed, never counted.
      - name: Scenario book
        run: pnpm test:scenarios
      # The built API and worker start as a server starts them: the API answers its health check on
      # the migrated development database; the worker runs pg-boss as mizan_queue and schedules its jobs.
      - name: The built API and worker start
        run: |
          pnpm build
          pnpm check:boot
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  # The whole Playwright suite of apps/web on its production build, split over two runners
  # (--shard, with fullyParallel). It runs in Playwright's own image, pinned to the version of
  # @playwright/test in apps/web (packages/config/test/ci.test.ts keeps them equal): Chromium, its
  # system libraries and fonts come with the image, so no step downloads them from Ubuntu's mirrors,
  # which took up to 13 minutes. The runner's user (1001) keeps the workspace's file owners.
  e2e:
    name: Playwright shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs, per shard: an unchanged app and suite are replayed, not rerun.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-${{ matrix.shard }}-
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
      # The report and the RTL screenshots (light and dark, 360, 768 and 1280 px) are the review
      # evidence of each run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  # The check the ruleset requires: it waits for every job above and passes when each passed or was
  # skipped (documentation only), and fails otherwise.
  checks:
    name: Typecheck, lint, test, build
    needs: [changes, static, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          ! echo "$NEEDS" | grep -qE '"result": "(failure|cancelled)"'

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks release `pnpm verify` runs too (scripts/tools.mjs; ci.test.ts keeps them equal).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_VERSION: 8.24.3
